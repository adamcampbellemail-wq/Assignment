<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>

  <!-- Roboto font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;0,900;1,300&display=swap" rel="stylesheet">

  <!-- Your own CSS (after font) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header + Hero (dark section) -->
  <div class="hero-wrapper">
    <header>
      <div class="logo">Header Logo</div>
      <ul>
        <li><a href="#">header link one</a></li>
        <li><a href="#">header link two</a></li>
        <li><a href="#">header link three</a></li>
      </ul>
    </header>

    <section class="hero">
      <div class="hero-text">
        <h1>This website is awesome</h1>
        <p>This website has some subtext that goes here under the main title. It's a smaller font and the color is lower contrast</p>
        <button class="button">Sign up</button>
      </div>

      <div class="hero-image">
        this is a placeholder for an image
      </div>
    </section>
  </div>

  <!-- Information section -->
  <section class="info">
    <!-- heading + 4 boxes -->
  </section>

  <!-- Quote section -->
  <section class="quote">
    <!-- quote + author -->
  </section>

  <!-- Call to action section -->
  <section class="cta">
    <!-- call to action -->
  </section>

  <!-- Footer -->
  <footer>
    <p>Copyright &copy; The Odin Project 2021</p>
  </footer>

</body>
</html>
